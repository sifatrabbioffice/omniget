name: Build Unsigned iOS IPA (Patched Trash)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI (only for ios init)
        run: cargo install tauri-cli --version "^2" --locked

      # ============================================================
      # ধাপ ১: trash ক্রেটের iOS-সামঞ্জস্যপূর্ণ প্যাচড কপি তৈরি
      # ============================================================
      - name: Download and patch trash crate for iOS
        run: |
          set -e
          WORKDIR="$RUNNER_TEMP/trash-patched"
          mkdir -p "$WORKDIR"

          # crates.io থেকে trash 5.2.7 ডাউনলোড ও এক্সট্রাক্ট
          curl -L -o trash.crate "https://crates.io/api/v1/crates/trash/5.2.7/download"
          tar -xzf trash.crate -C "$WORKDIR" --strip-components=1
          rm trash.crate

          # Python স্ক্রিপ্ট দিয়ে lib.rs প্যাচ ও iOS স্টাব তৈরি
          python3 - <<'PY'
          import os

          workdir = os.environ['WORKDIR']
          lib_path = os.path.join(workdir, 'src', 'lib.rs')
          platform_stub_path = os.path.join(workdir, 'src', 'platform_ios.rs')

          with open(lib_path, 'r') as f:
              content = f.read()

          # ১. আসল platform মডিউল শুধু নন-iOS টার্গেটে কম্পাইল হবে
          content = content.replace(
              'mod platform;',
              '#[cfg(not(any(target_os = "ios", target_os = "android")))]\nmod platform;'
          )

          # ২. iOS/Android-এর জন্য স্টাব platform মডিউল কম্পাইল হবে
          content = content.replace(
              '#[cfg(not(any(target_os = "ios", target_os = "android")))]\nmod platform;',
              '#[cfg(not(any(target_os = "ios", target_os = "android")))]\nmod platform;\n\n#[cfg(any(target_os = "ios", target_os = "android"))]\n#[path = "platform_ios.rs"]\nmod platform;'
          )

          with open(lib_path, 'w') as f:
              f.write(content)

          # ৩. iOS স্টাব তৈরি: PlatformTrashContext ও প্রয়োজনীয় ফাংশন
          stub = r'''
          // iOS/Android-এর জন্য স্টাব ইমপ্লিমেন্টেশন
          // আসল ডেস্কটপ ট্র্যাশ সিস্টেম না থাকায় সরাসরি ফাইল ডিলিট করা হবে।

          use std::path::{Path, PathBuf};

          pub struct PlatformTrashContext {
              // কোনো স্টেট প্রয়োজন নেই
          }

          impl PlatformTrashContext {
              pub fn new() -> Self {
                  Self {}
              }

              pub fn delete_all_canonicalized(&self, paths: &[PathBuf]) -> Result<(), Box<dyn std::error::Error>> {
                  for p in paths {
                      std::fs::remove_file(p)?;
                  }
                  Ok(())
              }
          }

          // যদি crate-এর অন্য ফাংশনও platform মডিউলের উপর নির্ভর করে, সেগুলো এখানে যোগ করুন।
          '''
          with open(platform_stub_path, 'w') as f:
              f.write(stub)

          print("Patched trash crate created at:", workdir)
          PY

      # ============================================================
      # ধাপ ২: iOS প্রজেক্ট ইনিশিয়ালাইজ
      # ============================================================
      - name: Initialize iOS project (if not already generated)
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            pnpm tauri ios init
          fi

      # ============================================================
      # ধাপ ৩: cargo build + প্যাচড trash ক্রেট
      # ============================================================
      - name: Build Rust library for iOS with patched trash
        run: |
          set -e
          cd src-tauri
          rm -f Cargo.lock   # পুরোনো লকফাইল সরান

          cargo build \
            --package omniget \
            --target aarch64-apple-ios \
            --release \
            --lib \
            --config "patch.crates-io.trash.path='${{ env.WORKDIR }}'"

          echo "Rust library built successfully for iOS."

      # ============================================================
      # ধাপ ৪: Xcode কোড সাইনিং ডিজেবল + xcodebuild
      # ============================================================
      - name: Disable code signing and build with xcodebuild
        run: |
          set -e
          PBXPROJ=$(find src-tauri/gen/apple -name "project.pbxproj" | head -n 1)
          if [ -z "$PBXPROJ" ]; then
            echo "::error::project.pbxproj not found!"
            exit 1
          fi

          # কোড সাইনিং সম্পূর্ণ বন্ধ
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$PBXPROJ" || true
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ" || true
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ" || true

          XCODEPROJ=$(find src-tauri/gen/apple -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          cd src-tauri/gen/apple

          xcodebuild -project "$XCODEPROJ" \
            -scheme omniget_iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # ============================================================
      # ধাপ ৫: .app খোঁজা
      # ============================================================
      - name: Locate .app artifact
        id: find_app
        run: |
          APP_PATH=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_OUTPUT
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found after xcodebuild."
            exit 1
          fi

      # ============================================================
      # ধাপ ৬: আনসাইনড IPA প্যাকেজিং
      # ============================================================
      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="${{ steps.find_app.outputs.APP_PATH }}"
          APP_NAME=$(basename "$APP_PATH" .app)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          chmod -R 755 Payload/
          find Payload -type f -exec chmod 644 {} \;
          zip -r -q "${APP_NAME}-unsigned.ipa" Payload/
          rm -rf Payload
          echo "IPA created: ${APP_NAME}-unsigned.ipa"

      # ============================================================
      # ধাপ ৭: IPA আপলোড
      # ============================================================
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OmniGet-unsigned-ipa
          path: "*-unsigned.ipa"
          if-no-files-found: error
