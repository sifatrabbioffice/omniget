name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Initialize iOS project (if not already generated)
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            pnpm tauri ios init
          fi

      - name: Disable code signing in Xcode project
        run: |
          PROJECT_FILE=$(find src-tauri/gen/apple -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::Xcode project not found!"
            exit 1
          fi
          PBXPROJ="$PROJECT_FILE/project.pbxproj"
          echo "Patching: $PBXPROJ"
          # কোড সাইনিং সম্পূর্ণ ডিজেবল করা হচ্ছে
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' "$PBXPROJ"
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ"
          # Build settings-এ CODE_SIGNING_ALLOWED = NO ইনজেক্ট করা হচ্ছে
          sed -i '' 's/buildSettings = {/buildSettings = {\n\t\t\t\tCODE_SIGNING_ALLOWED = NO;/g' "$PBXPROJ" || true
          echo "Code signing disabled."

      - name: Build iOS app (expect exit code 70 without signing)
        id: ios_build
        continue-on-error: true
        run: pnpm tauri ios build

      - name: Locate .app artifact
        id: find_app
        run: |
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          echo "Found .app at: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_OUTPUT
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app file found. The build genuinely failed."
            exit 1
          fi

      - name: Package unsigned IPA manually
        run: |
          APP_PATH="${{ steps.find_app.outputs.APP_PATH }}"
          APP_NAME=$(basename "$APP_PATH" .app)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          chmod -R 755 Payload/
          find Payload -type f -exec chmod 644 {} \;
          zip -r -q "${APP_NAME}-unsigned.ipa" Payload/
          rm -rf Payload
          echo "IPA created: ${APP_NAME}-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OmniGet-unsigned-ipa
          path: "*-unsigned.ipa"
          if-no-files-found: error
