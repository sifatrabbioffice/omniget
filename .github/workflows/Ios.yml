name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # package.json-এর "packageManager": "pnpm@10.29.3" থেকে অটো ডিটেক্ট হবে
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Initialize iOS project (if not already generated)
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            pnpm tauri ios init
          fi

      - name: Build iOS app (unsigned)
        id: ios_build
        continue-on-error: true
        run: pnpm tauri ios build --no-sign

      - name: Locate built artifacts
        id: find_artifacts
        run: |
          echo "--- Searching for .app and .ipa files ---"
          find src-tauri/gen/apple -name "*.app" -type d 2>/dev/null || true
          find src-tauri/gen/apple -name "*.ipa" -type f 2>/dev/null || true
          echo "----------------------------------------"

          APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          IPA_PATH=$(find src-tauri/gen/apple -name "*.ipa" -type f | head -n 1)

          echo "APP_PATH=$APP_PATH" >> $GITHUB_OUTPUT
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_OUTPUT

      - name: Fail if no artifact was produced
        if: steps.find_artifacts.outputs.APP_PATH == '' && steps.find_artifacts.outputs.IPA_PATH == ''
        run: |
          echo "::error::No .app or .ipa file was produced. Check the build logs above."
          exit 1

      - name: Package unsigned IPA (if Tauri did not produce one)
        if: steps.find_artifacts.outputs.IPA_PATH == '' && steps.find_artifacts.outputs.APP_PATH != ''
        run: |
          APP_PATH="${{ steps.find_artifacts.outputs.APP_PATH }}"
          echo "Manually packaging .app into unsigned IPA: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -q OmniGet-unsigned.ipa Payload/
          rm -rf Payload

          echo "Created OmniGet-unsigned.ipa"

      - name: Use Tauri-built IPA (if available)
        if: steps.find_artifacts.outputs.IPA_PATH != ''
        run: |
          cp "${{ steps.find_artifacts.outputs.IPA_PATH }}" OmniGet-unsigned.ipa
          echo "Using Tauri-built IPA directly."

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OmniGet-unsigned-ipa
          path: OmniGet-unsigned.ipa
          if-no-files-found: error
