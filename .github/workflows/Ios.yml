name: Build Unsigned iOS IPA (Direct Cargo Approach)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri CLI (only for ios init)
        run: cargo install tauri-cli --version "^2" --locked

      # ============================================================
      # ধাপ ১: trash শিম ক্রেট তৈরি (iOS-এ নো-অপ)
      # ============================================================
      - name: Create trash shim crate
        run: |
          set -e
          SHIM_DIR="$RUNNER_TEMP/trash-shim"
          mkdir -p "$SHIM_DIR/src"

          cat > "$SHIM_DIR/Cargo.toml" <<'EOF'
          [package]
          name = "trash"
          version = "5.2.7"
          edition = "2021"

          [lib]
          name = "trash"
          path = "src/lib.rs"

          [target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
          trash_orig = { package = "trash", version = "5.2.7" }
          EOF

          cat > "$SHIM_DIR/src/lib.rs" <<'EOF'
          #[cfg(any(target_os = "ios", target_os = "android"))]
          pub fn delete<T: AsRef<std::path::Path>>(path: T) -> Result<(), Box<dyn std::error::Error>> {
              std::fs::remove_file(path.as_ref())?;
              Ok(())
          }
          #[cfg(any(target_os = "ios", target_os = "android"))]
          pub fn delete_all<T: AsRef<std::path::Path>>(paths: &[T]) -> Result<(), Box<dyn std::error::Error>> {
              for p in paths { std::fs::remove_file(p.as_ref())?; }
              Ok(())
          }
          #[cfg(not(any(target_os = "ios", target_os = "android")))]
          pub use trash_orig::*;
          EOF

          echo "Shim crate created at: $SHIM_DIR"
          echo "SHIM_DIR=$SHIM_DIR" >> $GITHUB_ENV

      # ============================================================
      # ধাপ ২: iOS প্রজেক্ট ইনিশিয়ালাইজ (শুধু একবার)
      # ============================================================
      - name: Initialize iOS project (if not already generated)
        run: |
          if [ ! -d "src-tauri/gen/apple" ]; then
            pnpm tauri ios init
          fi

      # ============================================================
      # ধাপ ৩: cargo build + --config patch (মূল ধাপ)
      # ============================================================
      - name: Build Rust library for iOS with cargo --config patch
        run: |
          set -e
          cd src-tauri

          # Cargo.lock সরান যাতে প্যাচ কার্যকর হয়
          rm -f Cargo.lock

          # --config দিয়ে trash প্যাচ ইনজেক্ট করা হচ্ছে
          cargo build \
            --package omniget \
            --target aarch64-apple-ios \
            --release \
            --lib \
            --config "patch.crates-io.trash.path='${{ env.SHIM_DIR }}'"

          echo "Rust library built successfully."

      # ============================================================
      # ধাপ ৪: Xcode প্রজেক্ট প্যাচ + xcodebuild
      # ============================================================
      - name: Disable code signing and build with xcodebuild
        run: |
          set -e
          PBXPROJ=$(find src-tauri/gen/apple -name "project.pbxproj" | head -n 1)
          if [ -z "$PBXPROJ" ]; then
            echo "::error::project.pbxproj not found!"
            exit 1
          fi

          # কোড সাইনিং ডিজেবল
          sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' "$PBXPROJ" || true
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBXPROJ" || true
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' "$PBXPROJ" || true

          # xcodebuild দিয়ে .app তৈরি
          XCODEPROJ=$(find src-tauri/gen/apple -name "*.xcodeproj" -maxdepth 2 | head -n 1)
          cd src-tauri/gen/apple

          xcodebuild -project "$XCODEPROJ" \
            -scheme omniget_iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # ============================================================
      # ধাপ ৫: .app খোঁজা
      # ============================================================
      - name: Locate .app artifact
        id: find_app
        run: |
          APP_PATH=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -n 1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_OUTPUT
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found after xcodebuild."
            exit 1
          fi

      # ============================================================
      # ধাপ ৬: আনসাইনড IPA প্যাকেজিং
      # ============================================================
      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="${{ steps.find_app.outputs.APP_PATH }}"
          APP_NAME=$(basename "$APP_PATH" .app)
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          chmod -R 755 Payload/
          find Payload -type f -exec chmod 644 {} \;
          zip -r -q "${APP_NAME}-unsigned.ipa" Payload/
          rm -rf Payload
          echo "IPA created: ${APP_NAME}-unsigned.ipa"

      # ============================================================
      # ধাপ ৭: IPA আপলোড
      # ============================================================
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: OmniGet-unsigned-ipa
          path: "*-unsigned.ipa"
          if-no-files-found: error
